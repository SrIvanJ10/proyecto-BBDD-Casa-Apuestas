<!-- backend/templates/home.html -->
<!DOCTYPE html>
<html>
<head>
    <title>SportPredict - Dev</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .success { color: green; font-weight: bold; }
        .services { background: #f5f5f5; padding: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>SportPredict</h1>
    <p class="success">{{ message }}</p>
    
    <div class="services">
        <h3>Servicios Configurados:</h3>
        <ul>
            {% for service in services %}
            <li>{{ service }}</li>
            {% endfor %}
        </ul>
    </div>

    <p>
        <strong>Endpoints disponibles:</strong><br>
        • <a href="/">Home</a><br>
        • <a href="/health/">Health Check</a><br>
        • <a href="/status/">Services Status</a><br>
        • <a href="/admin/">Admin Django</a>
    </p>

    <footer>
        <em>Desarrollo activo - Sprint 1</em>
    </footer>
</body>
</html>
