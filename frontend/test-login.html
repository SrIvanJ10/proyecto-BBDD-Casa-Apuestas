<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>🔐 Test de Login API</h1>
    
    <div class="form-group">
        <label for="username">Usuario:</label>
        <input type="text" id="username" value="dios">
    </div>
    
    <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" value="PorElPadreElHijoYElEspirituSanto">
    </div>
    
    <button onclick="testLogin()">Probar Login</button>
    
    <div id="result"></div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.className = 'info';
            resultDiv.textContent = '🔄 Enviando petición...';
            
            try {
                const response = await fetch('http://192.168.1.239:8000/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email_or_username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = '✅ Login exitoso!\n\n' + 
                        'Status: ' + response.status + '\n' +
                        'Token: ' + data.token + '\n' +
                        'Usuario: ' + JSON.stringify(data.user, null, 2);
                    
                    // Guardar en localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = '❌ Error en login:\n\n' +
                        'Status: ' + response.status + '\n' +
                        'Error: ' + (data.error || JSON.stringify(data));
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = '❌ Error de red o CORS:\n\n' + error.message;
                console.error('Error completo:', error);
            }
        }
    </script>
</body>
</html>
